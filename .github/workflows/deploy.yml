name: Deploy Alisha to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local from secrets
        run: |
          echo "NEXT_PUBLIC_OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}" > .env.local
          echo "NEXT_PUBLIC_NVIDIA_KEY=${{ secrets.NVIDIA_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_ABLITERATION_KEY=${{ secrets.ABLITERATION_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_HUGGINGFACE_KEY=${{ secrets.HUGGINGFACE_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_GEMINI_KEY=${{ secrets.GEMINI_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env.local
          echo "=== .env.local created (values hidden) ==="
          sed 's/=.*/=***/' .env.local

      - name: Build static site
        run: npx next build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
